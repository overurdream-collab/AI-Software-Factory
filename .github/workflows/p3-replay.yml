name: P3 pinned evidence replay
on:
  push:
    branches: ['coord/p3-evidence-replay-v1']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45899931096
          name: p3-live-crash-evidence
          path: ${{ runner.temp }}/p3-original
      - run: node --test test/coordinator-p3-replay.test.mjs
      - name: Replay exact patches
        run: |
          FILE="$RUNNER_TEMP/p3-original/evidence.json"
          IMAGE=$(node -e 'const e=require(process.argv[1]);if(!/^sha256:[a-f0-9]{64}$/.test(e.imageDigest))process.exit(1);console.log(e.imageDigest)' "$FILE")
          docker pull "node@$IMAGE"
          node scripts/coordinator-p3-replay.mjs "$FILE" > "$RUNNER_TEMP/replay.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-coordinator-replay
          path: ${{ runner.temp }}/replay.json
