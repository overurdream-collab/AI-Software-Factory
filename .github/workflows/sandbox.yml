name: Isolated execution pilot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker pull node:22-alpine
      - run: node --test test/sandbox.integration.test.mjs
        env:
          FACTORY_DOCKER_TEST: '1'
